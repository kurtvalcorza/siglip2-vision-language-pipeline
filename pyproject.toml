[project]
name = "siglip2-vision-language-pipeline"
version = "0.1.0"
description = "DIMER-oriented SigLIP 2 pipeline for zero-shot image classification, embeddings, similarity, and retrieval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kurt Valcorza" }]
keywords = ["siglip2", "vision-language", "zero-shot", "retrieval", "dimer"]
dependencies = [
    "huggingface-hub>=0.34.0,<1.0",
    "numpy>=2.0,<3.0",
    "pillow>=10.4,<12.0",
    "safetensors>=0.5.0,<1.0",
    "torch>=2.4,<3.0",
    "transformers>=4.54.1,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siglip2_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: downloads and runs the real pinned SigLIP 2 checkpoint",
]
