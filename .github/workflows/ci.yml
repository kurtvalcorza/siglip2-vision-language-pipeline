name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen reference environment
        run: python -m pip install -r requirements.lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Lock parity
        run: python scripts/check_lock.py
      - name: Ruff
        run: ruff check .
      - name: Unit and contract tests
        run: pytest -m 'not integration' -q

  integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_INTEGRATION: '1'
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: siglip2-base-patch16-224-${{ runner.os }}-v1
      - name: Install frozen reference environment
        run: python -m pip install -r requirements.lock.txt
      - name: Install package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Lock parity
        run: python scripts/check_lock.py
      - name: Real pinned checkpoint smoke test
        run: pytest -m integration -q
      - name: Execute live tutorial top-to-bottom
        run: python tools/run_notebook.py tutorials/siglip2_vision_language_colab.ipynb
      - name: Upload tutorial outputs
        uses: actions/upload-artifact@v4
        with:
          name: siglip2-live-tutorial-outputs
          path: outputs/
